<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kennedy Poulet frit & Pizza — Montréal | Livraison gratuite</title>
<meta name="description" content="Poulet frit et pizza halal au 5904, boul. Gouin Ouest, Montréal. Livraison rapide et gratuite dès 20 $. Ouvert tous les jours de 11 h à 22 h. 514-903-4500.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Barlow+Condensed:wght@600;700&family=Lilita+One&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6EA; --surface:#FFFFFF; --surface-2:#FCEBD4; --ink:#2A1410; --ink-2:#6E5244;
  --line:#EBD6BA; --price:#B3261E; --red:#D7261E; --red-deep:#A8170F; --mustard:#FFC93C;
  --leaf:#2F8A34; --on-red:#FFF1DC;
  --display:"Lilita One","Arial Black",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --script:"Pacifico","Brush Script MT",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1E0F0B; --surface:#2A1410; --surface-2:#3A1D16; --ink:#FFF1DC; --ink-2:#D9C3A5; --line:#4A2A20; --price:#FFC93C; }
}
:root[data-theme="dark"]{ --bg:#1E0F0B; --surface:#2A1410; --surface-2:#3A1D16; --ink:#FFF1DC; --ink-2:#D9C3A5; --line:#4A2A20; --price:#FFC93C; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 132px)}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} .spin{animation:none!important} }
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--mustard);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.ic{display:block;flex:none}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:28px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.halal{width:40px;height:40px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;line-height:1;text-align:center;flex:none}
.halal b{display:block;font-size:14px;margin-bottom:1px}
.logo .k{font-family:var(--script);font-size:30px;line-height:1;color:var(--red);transform:rotate(-4deg) translateY(-3px)}
.logo .s{font-family:var(--display);font-size:14px;line-height:1.05;color:var(--ink-2)}
.links{display:flex;gap:24px;margin-left:auto}
.links a{text-decoration:none;font-weight:600;color:var(--ink-2)}
.links a:hover{color:var(--red)}
.lang{border:1px solid var(--line);background:none;color:var(--ink);font:600 15px var(--body);border-radius:999px;padding:6px 12px;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:13px 24px;font-weight:700;text-decoration:none;font-size:17px;border:0;cursor:pointer;line-height:1.1}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-deep)}
.btn-y{background:var(--mustard);color:#2A1410}
.btn-y:hover{background:#FFD566}
.btn-o{border:2px solid rgba(255,241,220,.7);color:var(--on-red)}
.btn-o:hover{background:rgba(255,241,220,.12)}
.phone-ic{width:18px;height:18px}

/* hero */
.hero{background:var(--red);color:var(--on-red);position:relative;overflow:hidden;padding:64px 0 96px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:28px;background:radial-gradient(circle at 18px 28px, var(--bg) 18px, transparent 19px) repeat-x;background-size:36px 28px}
.hero-in{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:40px}
.status{display:inline-flex;align-items:center;gap:10px;background:rgba(0,0,0,.16);border-radius:999px;padding:6px 14px 6px 10px;font-weight:600;font-size:15px;margin:0 0 22px}
.status .dot{width:10px;height:10px;border-radius:50%;background:#7CE07F;box-shadow:0 0 0 4px rgba(124,224,127,.25)}
.status.closed .dot{background:var(--mustard);box-shadow:0 0 0 4px rgba(255,201,60,.25)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,6.4vw,84px);line-height:.98;margin:0 0 20px;letter-spacing:.3px;text-wrap:balance}
.lede{font-size:20px;max-width:30em;margin:0 0 30px;color:var(--on-red)}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.art{position:relative;aspect-ratio:1/1;max-width:520px;width:100%;justify-self:end}
.art .pz{position:absolute;inset:4% 0 0 8%;width:92%;height:auto}
.spin{animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.art .ck{position:absolute;left:-4%;bottom:-2%;width:42%;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.sticker{position:absolute;right:0;top:0;width:150px;height:150px;border-radius:50%;background:var(--mustard);color:#2A1410;display:grid;place-items:center;text-align:center;transform:rotate(10deg);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.sticker small{display:block;font-weight:700;font-size:14px;line-height:1.15}
.sticker b{display:block;font-family:var(--display);font-weight:400;font-size:36px;line-height:1;margin-top:4px}

/* perks */
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:48px auto 0}
.perk{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.perk .g{white-space:nowrap;font-family:var(--display);font-size:34px;line-height:1;color:var(--red);min-width:76px;text-align:center}
.perk h3{margin:0;font-size:18px}
.perk p{margin:2px 0 0;color:var(--ink-2);font-size:15px}

/* section heads */
section.block{padding:72px 0 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.sh h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.4vw,52px);line-height:1;margin:0;color:var(--ink)}
.sh p{margin:0;color:var(--ink-2);max-width:32em}

/* favourites */
.favs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.fav{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:8px}
.fav .pic{background:var(--surface-2);border-radius:16px;height:150px;display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:6px}
.fav h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.1}
.fav p{margin:0;color:var(--ink-2);font-size:15px;flex:1}
.fav .pr{font-size:26px}

/* menu */
.tabs{position:sticky;top:72px;z-index:15;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -24px;padding:10px 24px}
.tabs-in{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;text-decoration:none;font-weight:600;font-size:15px;padding:8px 16px;border-radius:999px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{padding-top:44px}
.cat-h{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.cat-h h3{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;margin:0}
.cat-h em{color:var(--ink-2);font-style:italic}
.cat-note{color:var(--ink-2);margin:0 0 18px}
.pr{font-family:var(--cond);font-weight:700;color:var(--price);white-space:nowrap;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.card .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card h4{margin:0;font-size:19px;line-height:1.2}
.card h4 span{font-weight:500;color:var(--ink-2);font-size:15px;font-style:italic;margin-left:6px}
.card .code{white-space:nowrap;font-family:var(--cond);font-weight:700;color:var(--ink-2);font-size:15px}
.card p{margin:0;color:var(--ink-2);font-size:15px;flex:1}
.card .pr{font-size:24px}
.sizes4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;text-align:center}
.sizes4 div{font-family:var(--cond);font-weight:600;font-size:15px;color:var(--ink-2);line-height:1.2;border-radius:8px;padding:3px 0}
.sizes4 div b{display:block;font-size:12px;font-weight:600;opacity:.8}
.sizes4 div.on{background:var(--surface-2);color:var(--ink)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;margin:0 0 18px}
.seg button{border:0;background:none;font:700 15px var(--body);color:var(--ink-2);padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.seg-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg-row span{color:var(--ink-2);font-weight:600;margin-bottom:18px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 20px}
.li{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .n{font-weight:600}
.li .e{color:var(--ink-2);font-style:italic;font-size:15px}
.li .sp{flex:1}
.li .pr{font-size:21px}
.li .pr + .pr{margin-left:14px}
.li .multi{display:flex;gap:18px}
.li .multi span{text-align:right}
.li .multi small{display:block;font:600 12px var(--body);color:var(--ink-2);text-align:right}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.sub-h{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.sub-h{flex-wrap:wrap;row-gap:0}
.sub-h h4{white-space:nowrap;font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.sub-h em{color:var(--ink-2);font-size:15px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.deal.hot{background:var(--red);color:#fff;border-color:var(--red)}
.deal.hot .pr,.deal.hot .muted{color:var(--on-red)}
.deal .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.deal h4{white-space:nowrap;margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.deal .icons{display:flex;gap:2px;min-width:0;overflow:hidden;justify-content:flex-end}
.deal ul{list-style:none;margin:4px 0 8px;padding:0;font-size:16px;line-height:1.35;flex:1}
.deal li::before{content:"+ ";opacity:.6}
.deal li:first-child::before{content:""}
.deal .pr{font-size:28px}
.muted{color:var(--ink-2);font-size:14px;font-weight:600}
.chips{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:10px}
@media (max-width:960px){.chips{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.chip span{font-weight:600;white-space:nowrap;font-size:15px}
.chip .pr{font-size:22px}
.promo-line{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:16px;padding:10px 16px;font-weight:600}
.pill .pr{font-size:22px}

/* info */
.info{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px}
.panel h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 12px}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;font-weight:600}
.hours tr.today td{color:var(--red);font-weight:700}
.facts{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.facts li{display:flex;gap:12px;align-items:baseline}
.facts b{min-width:120px}
.mapcard{background:var(--red);color:var(--on-red);border:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.mapcard .streets{position:absolute;inset:0;opacity:.18}
.mapcard > *:not(.streets){position:relative}
.mapcard address{font-style:normal;font-size:22px;font-weight:600;line-height:1.35;margin:0 0 20px}
.mapcard .pin{margin:auto 0 0}
.mapcard .ctas{margin-top:18px}

footer{margin-top:80px;background:#2A1410;color:#FFF1DC;padding:48px 0 32px}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}
footer .logo .s{color:#D9C3A5}
footer h4{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 8px;color:var(--mustard)}
footer p{margin:0 0 4px;color:#D9C3A5}
footer a{color:#FFF1DC}
.fine{border-top:1px solid #4A2A20;margin-top:32px;padding-top:18px;font-size:13px;color:#B9A188}

.callbar{display:none}
@media (max-width: 960px){
  .links{display:none}
  .hero-in{grid-template-columns:1fr}
  .art{max-width:300px;justify-self:center;order:-1;margin-top:-10px}
  .favs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .info{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr}
  .perks{grid-template-columns:1fr}
}
@media (max-width: 640px){
  body{font-size:16px}
  .nav-in .btn{display:none}
  .lang{margin-left:auto}
  .hero{padding:36px 0 80px}
  .sticker{width:112px;height:112px}
  .sticker b{font-size:28px}
  .sticker small{font-size:12px}
  .favs{grid-template-columns:1fr}
  .perk .g{font-size:26px;min-width:64px}
  .callbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  footer{padding-bottom:110px}
  .li{flex-wrap:wrap}
}
</style>
</head>

function mtl(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Montreal',hour:'numeric',hour12:false,weekday:'short'}).formatToParts(new Date());
  const h=+p.find(x=>x.type==='hour').value%24;const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.find(x=>x.type==='weekday').value);return{h,wd}}
function status(){const{h}=mtl();const s=document.getElementById('status'),txt=document.getElementById('status-t');
  if(h>=11&&h<22){s.classList.remove('closed');txt.textContent=t('open')}else{s.classList.add('closed');txt.textContent=h<11?t('closed_before'):t('closed_after')}}
function renderInfo(){const{wd}=mtl();const order=[1,2,3,4,5,6,0];
  document.getElementById('hours').innerHTML=order.map(d=>`<tr class="${d===wd?'today':''}"><td>${t('days')[d]}</td><td>${t('hrs')}</td></tr>`).join('');
  document.getElementById('facts').innerHTML=[[t('f_order'),`<a href="tel:+15149034500">${t('f_order_v')}</a>`],[t('f_deliv'),t('f_deliv_v')],[t('f_pay'),`${t('f_pay_v')}<br><span class="muted">${t('f_pay_n')}</span>`]].map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join('');}

let io;
function spy(){if(io)io.disconnect();const tabs=[...document.querySelectorAll('.tab')];
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const id=e.target.id.replace('cat-','');tabs.forEach(tb=>{const on=tb.dataset.cat===id;tb.classList.toggle('on',on);if(on)tb.parentElement.scrollTo({left:tb.offsetLeft-24,behavior:'smooth'})})}})},{rootMargin:'-140px 0px -70% 0px'});
  document.querySelectorAll('.cat').forEach(c=>io.observe(c));}

document.getElementById('lang').addEventListener('click',()=>{lang=lang==='fr'?'en':'fr';try{localStorage.setItem('kennedy-lang',lang)}catch(e){}render()});
render();setInterval(status,60000);
</script>
