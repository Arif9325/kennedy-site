<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kennedy Poulet frit & Pizza — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Lilita+One&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --roast:#2A1410;      /* fryer brown, the board background */
  --roast-2:#3A1D16;    /* raised panels */
  --red:#D7261E;        /* Kennedy red */
  --red-deep:#A8170F;
  --cream:#FFF1DC;      /* text */
  --cream-dim:#D9C3A5;  /* secondary text */
  --mustard:#FFC93C;    /* prices */
  --leaf:#3E9B3C;       /* halal / veg */
  --display:"Lilita One","Arial Black",Impact,sans-serif;
  --text:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --script:"Pacifico","Brush Script MT",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --roast:#2A1410; --cream:#FFF1DC; } }
:root[data-theme="dark"]{ --roast:#2A1410; --cream:#FFF1DC; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#140906;overflow:hidden;font-family:var(--text);color:var(--cream);cursor:none}
body.show-cursor{cursor:default}

/* 1920×1080 stage, scaled to whatever screen it's on */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:var(--roast);overflow:hidden}
.screen{position:absolute;inset:0;display:grid;grid-template-rows:120px 1fr 64px;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility 0s linear .8s}
.screen.on{opacity:1;visibility:visible;transition:opacity .8s ease,visibility 0s}
@media (prefers-reduced-motion: reduce){ .screen{transition:none} .spin{animation:none!important} }

/* header */
header{background:var(--red);display:flex;align-items:center;padding:0 44px;gap:36px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:var(--red-deep)}
.brand{display:flex;align-items:center;gap:18px;min-width:470px}
.brand .name{font-family:var(--script);font-size:66px;line-height:1;color:var(--cream);text-shadow:4px 4px 0 var(--red-deep);transform:rotate(-4deg) translateY(-6px)}
.brand .sub{font-family:var(--display);font-size:25px;line-height:1.05;color:var(--mustard)}
.halal{width:74px;height:74px;border-radius:50%;background:var(--leaf);border:4px solid var(--cream);display:grid;place-items:center;text-align:center;font-weight:700;font-size:15px;line-height:1;color:#fff}
.halal b{display:block;font-size:24px;font-family:"Noto Naskh Arabic","Arial",sans-serif;font-weight:700;margin-bottom:2px}
.title{flex:1;display:flex;align-items:baseline;gap:22px}
.title h1{margin:0;font-family:var(--display);font-weight:400;font-size:76px;line-height:1;color:var(--cream);letter-spacing:.5px}
.title span{font-size:30px;font-weight:600;font-style:italic;color:var(--cream)}
.call{text-align:right;line-height:1}
.call small{display:block;font-size:22px;font-weight:600;color:var(--cream);margin-bottom:4px}
.call strong{font-family:var(--display);font-weight:400;font-size:46px;color:var(--mustard)}
.dots{position:absolute;right:44px;bottom:8px;display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,241,220,.35)}
.dots i.on{background:var(--mustard)}

/* footer */
footer{background:var(--mustard);color:var(--roast);display:flex;align-items:center;justify-content:space-between;padding:0 44px;font-size:27px;font-weight:700}
footer .big{font-family:var(--display);font-weight:400;font-size:30px}

main{padding:40px 44px 26px;display:grid;gap:40px;min-height:0}

/* shared pieces */
.sec{min-width:0}
.sec + .sec{margin-top:24px}
.h2{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.h2 h2{margin:0;font-family:var(--display);font-weight:400;font-size:44px;line-height:1.05;color:var(--cream)}
.h2 em{font-style:italic;font-weight:500;font-size:24px;color:var(--cream-dim)}
.note{font-size:21px;color:var(--cream-dim);margin:0 0 10px;font-weight:500}
.ic{display:block}
.row{display:flex;align-items:baseline;gap:10px;padding:6px 0;font-size:29px;font-weight:600;line-height:1.15}
.row .nm{white-space:nowrap}
.row .en{font-style:italic;font-weight:500;color:var(--cream-dim);font-size:23px;white-space:nowrap}
.row .lead{flex:1;border-bottom:3px dotted rgba(255,241,220,.25);transform:translateY(-6px);min-width:20px}
.pr{font-weight:800;color:var(--mustard);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr sup{font-size:.62em;vertical-align:.42em;margin-left:1px}
.pr .d{font-size:.55em;vertical-align:.6em;margin-left:3px}
.multi{display:grid;align-items:baseline;column-gap:10px}
.multi .hd{font-size:20px;font-weight:700;color:var(--cream-dim);text-align:right;text-transform:none}
.multi .pr{text-align:right;font-size:29px}
.multi .nm{font-size:29px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.multi > *{padding:5px 0}

/* combo tiles */
.deal{background:var(--roast-2);border-radius:22px;padding:18px 22px;display:flex;flex-direction:column;position:relative;min-width:0}
.deal.hot{background:var(--red)}
.deal .lbl{font-family:var(--display);font-size:30px;line-height:1;color:var(--mustard)}
.deal.hot .lbl{color:var(--cream)}
.deal .what{font-size:27px;font-weight:600;line-height:1.18;margin-top:8px}
.deal .what div{white-space:nowrap}
.deal .what .plus{color:var(--cream-dim);font-weight:500}
.deal .what .plus b{color:var(--cream);font-weight:600}
.deal .bp{margin-top:auto;padding-top:8px;font-family:var(--display);font-weight:400;font-size:62px;line-height:1;color:var(--mustard)}
.deal .bp sup{font-size:.5em;vertical-align:.75em}
.deal .bp .d{font-size:.42em;vertical-align:1em;margin-left:4px}
.deal .tx{font-family:var(--text);font-size:19px;color:var(--cream-dim);font-weight:600;margin-left:6px;vertical-align:.2em}
.deal.hot .tx{color:var(--cream)}
.deal .icons{position:absolute;right:16px;top:16px;display:flex;gap:2px}

/* screen-specific layouts */
#s-pizza main{grid-template-columns:560px 1fr}
#s-pizza .hero{display:flex;flex-direction:column;gap:22px}
.spin{animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.promo{background:var(--red);border-radius:24px;padding:20px 26px;position:relative}
.promo .pct{white-space:nowrap;font-family:var(--display);font-size:80px;line-height:.9;color:var(--mustard)}
.promo .pct small{font-size:36px;color:var(--cream)}
.promo p{margin:6px 0 0;font-size:22px;font-weight:600;color:var(--cream);line-height:1.2}
.bread{display:flex;align-items:center;gap:18px;background:var(--roast-2);border-radius:24px;padding:14px 22px}
.bread .t{flex:1;font-size:30px;font-weight:700;line-height:1.1}
.bread .t em{display:block;font-size:22px;font-weight:500;color:var(--cream-dim)}
.bread .pr{font-family:var(--display);font-weight:400;font-size:54px}
.ptable{grid-template-columns:78px 1fr repeat(4,140px);column-gap:0}
.ptable > *{padding:9px 0}
.ptable .code{padding-left:12px}
.ptable > div:nth-child(n+7):not(.code):not(.nm){padding-right:14px}
.ptable .code{font-size:22px;font-weight:700;color:var(--cream-dim);white-space:nowrap}
.ptable .nm small{font-size:20px;font-weight:500;color:var(--cream-dim);margin-left:12px}
.ptable .hd{padding-right:14px;font-size:22px;line-height:1.05;color:var(--cream)}
.ptable .hd b{display:block;font-family:var(--display);font-weight:400;font-size:34px;color:var(--mustard)}
.ptable > .z{background:rgba(255,241,220,.045)}
.ptable .rowbg{grid-column:1/-1}

#s-poulet main{grid-template-columns:500px 720px 1fr}
#s-combos main{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:16px;padding-top:30px}
#s-combos .deal{padding:12px 18px;overflow:hidden}
#s-combos .deal .lbl{font-size:28px}
#s-combos .deal .what{font-size:25px;line-height:1.12;margin-top:4px}
#s-combos .deal .bp{font-size:58px;padding-top:2px;position:absolute;right:18px;bottom:12px}
#s-combos .deal .icons{top:10px;right:12px}
#s-burgers main, #s-plus main{grid-template-columns:1fr 1fr 1fr}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
.callout{display:flex;align-items:center;gap:16px;background:var(--red);border-radius:20px;padding:12px 20px;margin-top:14px}
.callout .t{flex:1;font-size:27px;font-weight:700;line-height:1.12}
.callout .t span{display:block;font-size:22px;font-weight:500}
.callout .pr{font-family:var(--display);font-weight:400;font-size:50px}
.callout.dark{background:var(--roast-2)}
</style>
</head>

       ${MENU.fish.map(f=>row('Poisson',f[0],f[1])).join('')}${MENU.shrimp.map(f=>row(f[0],'',f[1])).join('')}</div>
     ${plate(['fish',130],['shrimp',110])}
   </div>`},
];

const stage=document.getElementById('stage');
stage.innerHTML=screens.map(s=>`<section class="screen" id="${s.id}">${header(s.title,s.sub)}<main>${s.body()}</main>${footer}</section>`).join('');
const els=[...stage.querySelectorAll('.screen')];

function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* which screen?  …/#1 to …/#5 pins one board per TV; no number = rotate through all */
let cur=0,timer=null;const pinned=()=>{const n=parseInt((location.hash||'').replace(/\D/g,''),10);return n>=1&&n<=els.length?n-1:null};
function show(i){cur=(i+els.length)%els.length;els.forEach((e,k)=>e.classList.toggle('on',k===cur));
  const rotating=pinned()===null;
  stage.querySelectorAll('.dots').forEach(d=>d.innerHTML=rotating?els.map((_,k)=>`<i class="${k===cur?'on':''}"></i>`).join(''):'');}
function start(){clearInterval(timer);const p=pinned();if(p!==null){show(p);return}show(cur);timer=setInterval(()=>show(cur+1),15000)}
addEventListener('hashchange',start);start();
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){show(cur+1);start()} if(e.key==='ArrowLeft'){show(cur-1);start()}
  if(/^[1-9]$/.test(e.key)&&+e.key<=els.length){location.hash=e.key}
  if(e.key==='0'){history.replaceState(null,'',location.pathname);start()}
  if(e.key==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
});
let mt;addEventListener('mousemove',()=>{document.body.classList.add('show-cursor');clearTimeout(mt);mt=setTimeout(()=>document.body.classList.remove('show-cursor'),2500)});
</script>
</body>
